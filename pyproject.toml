[project]
name = "airflow-monorepo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

# Local dev only. Airflow itself runs in the container (docker/airflow/Dockerfile).
[dependency-groups]
dev = [
    "dbt-bigquery==1.12.1",
    "pre-commit",
    "ruff==0.17.3",
    "sqlfluff==4.5.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

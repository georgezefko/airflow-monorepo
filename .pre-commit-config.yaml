repos:
  - repo: local
    hooks:
      - id: dbt-parse
        name: dbt parse
        entry: bash -c 'GCP_PROJECT=${GCP_PROJECT:-ci-placeholder} uv run dbt parse --quiet --target-path target/pre-commit'
        language: system
        files: ^(dbt_project\.yml|profiles\.yml|macros/|teams/[^/]+/dbt/)
        pass_filenames: false

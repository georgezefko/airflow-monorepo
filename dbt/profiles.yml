# Env vars only, no secrets. Auth comes from ADC (GOOGLE_APPLICATION_CREDENTIALS or gcloud login).
thelook:
  target: dev
  outputs:
    dev: &bq
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: "{{ env_var('DBT_DATASET', 'dbt_dev') }}"
      location: US  # thelook_ecommerce lives in US, so output datasets must too
      threads: 4
      job_execution_timeout_seconds: 300
      maximum_bytes_billed: 10000000000  # 10 GB guard rail per query
    prod:
      <<: *bq
      dataset: analytics  # only used for models without a custom schema

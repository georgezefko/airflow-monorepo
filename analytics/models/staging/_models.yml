models:
  - name: stg_orders
    description: One row per order from thelook.
    columns:
      - name: order_id
        description: Primary key of the order.
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: ID of the user who placed the order.
      - name: status
        description: Current status of the order, such as Cancelled.
      - name: created_at
        description: Timestamp when the order was created.
  - name: stg_order_items
    description: One row per item in an order.
    columns:
      - name: order_item_id
        description: Primary key of the order item.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: ID of the order the item belongs to.
      - name: status
        description: Current status of the item, such as Returned.
      - name: sale_price
        description: Price the item sold for.
      - name: created_at
        description: Timestamp when the item was created.
  - name: stg_users
    description: One row per user, without personal details.
    columns:
      - name: user_id
        description: Primary key of the user.
        data_tests:
          - unique
          - not_null
      - name: traffic_source
        description: Channel the user came from, such as Search.
      - name: country
        description: Country of the user.
      - name: created_at
        description: Timestamp when the user was created.


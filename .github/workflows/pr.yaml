name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ci-placeholder  # parse never connects to BigQuery
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: dbt parse
        run: uv run dbt parse

      - name: Build Airflow image
        run: docker build -t airflow-ci .

      - name: DAG tests (once per team)
        run: |
          docker run --rm --entrypoint python -w /opt/airflow/repo \
            -v "$PWD:/opt/airflow/repo:ro" \
            -v "$PWD/plugins:/opt/airflow/plugins:ro" \
            airflow-ci -m pytest tests -q -p no:cacheprovider
  dbt-build:
    needs: checks
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository  # forks get no GCP token
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: project-09344e23-c1cd-49df-a40
      DBT_DATASET: ci_pr_${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - uses: astral-sh/setup-uv@v6

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/147789725218/locations/global/workloadIdentityPools/github/providers/github
          service_account: ci-dbt@project-09344e23-c1cd-49df-a40.iam.gserviceaccount.com

      - name: Manifest of main (what's in analytics_*)
        run: |
          # ponytail: skipped while main still has the old analytics/ layout; remove once it's merged
          [ -f base/dbt_project.yml ] || exit 0
          cd base && DBT_DATASET=analytics uv run --project "$GITHUB_WORKSPACE" dbt parse --target-path "$GITHUB_WORKSPACE/state"

      - name: Build what the PR changed (across all teams)
        run: |
          if [ -f state/manifest.json ]; then
            uv run dbt build -s state:modified+ --defer --state state
          else
            uv run dbt build   # no manifest of main to compare with: build everything
          fi
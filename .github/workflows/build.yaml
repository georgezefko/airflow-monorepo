name: Build

on:
  push:
    branches: [main]
    paths: ['analytics/**', '.github/workflows/build.yaml']

jobs:
  dbt-image:
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write}
    env:
      REGISTRY: us-central1-docker.pkg.dev
      IMAGE: us-central1-docker.pkg.dev/project-09344e23-c1cd-49df-a40/airflow-monorepo/dbt:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/147789725218/locations/global/workloadIdentityPools/github/pro
          service_account: ci-build@project-09344e23-c1cd-49df-a40.iam.gserviceaccount.com
          token_format: acc
      - name: Log in to Artifact Registry
        run: echo "${{ steps.auth.outputs.access_token }}" | docker login "$REGISTRY" -u oauth2access
      - name: Build and push
        run: docker build -t "$IMAGE" analytics && docker push "$IMAGE"
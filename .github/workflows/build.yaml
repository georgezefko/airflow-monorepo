name: Build

on:
  push:
    branches: [main]
    paths:  # everything that goes into the Airflow image
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'  # dbt versions
      - 'uv.lock'
      - '.github/workflows/build.yaml'

jobs:
  # The platform's Airflow image: Airflow, Cosmos, the dbt CLI and the shared DAG helpers.
  # Teams' DAGs, dbt models and SQL aren't in it; Airflow reads them from each team's git bundle.
  airflow-image:
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write}
    env:
      REGISTRY: us-central1-docker.pkg.dev
      REPO: us-central1-docker.pkg.dev/project-09344e23-c1cd-49df-a40/airflow-monorepo/airflow
      PROD_REPO: us-central1-docker.pkg.dev/tutorials-demo-prod/airflow-monorepo/airflow  # prod's own registry
    steps:
      - uses: actions/checkout@v4
      # Tag <airflow version>-<short sha>, e.g. 3.3.2-d746796: unique per commit, and says which Airflow it runs.
      - id: tag
        run: echo "tag=$(sed -n 's|^FROM apache/airflow:||p' Dockerfile)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/147789725218/locations/global/workloadIdentityPools/github/providers/github
          service_account: ci-build@project-09344e23-c1cd-49df-a40.iam.gserviceaccount.com
          token_format: access_token
      - name: Log in to Artifact Registry
        run: echo "${{ steps.auth.outputs.access_token }}" | docker login "$REGISTRY" -u oauth2accesstoken --password-stdin
      # Multi-arch so the same tag runs on GKE (amd64) and a Mac's kind node (arm64).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REPO }}:${{ steps.tag.outputs.tag }}
            ${{ env.PROD_REPO }}:${{ steps.tag.outputs.tag }}
